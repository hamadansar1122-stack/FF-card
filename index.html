<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Tactical Card Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #07080c; color: #e1e3ed; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 12px; }
        .header h2 { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; }

        .container { width: 100%; max-width: 450px; background: #0e1017; padding: 14px; border-radius: 14px; border: 1px solid #1a1d2b; }
        .section-title { font-size: 11px; color: #7f86a3; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        
        /* 20 Templates Grid */
        .template-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; padding: 4px; background: #07080c; border-radius: 8px; border: 1px solid #181b29; margin-bottom: 12px; }
        .tpl-card { background: #161824; border: 2px solid #22273a; border-radius: 6px; height: 85px; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .tpl-card.active { border-color: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }
        
        .tpl-info { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 4px; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
        .tpl-name { font-size: 10px; font-weight: bold; color: #fff; }
        .tpl-price { font-size: 9px; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
        .price-free { background: #00e676; color: #000; }
        .price-paid { background: #ff0055; color: #fff; }

        label { font-size: 11px; color: #a0a6c0; margin-top: 10px; display: block; font-weight: 600; }
        input { width: 100%; padding: 10px; margin-top: 4px; background: #07080c; border: 1px solid #22273a; color: #fff; border-radius: 6px; outline: none; font-size: 13px; font-weight: 600; }
        input:focus { border-color: #ffaa00; }

        input[type="file"] { display: none; }
        .file-btn { display: block; text-align: center; background: #1a1d2e; color: #ffaa00; border: 1px solid #ffaa00; padding: 9px; margin-top: 4px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; }
        .file-btn-rank { color: #00e5ff; border-color: #00e5ff; }

        .canvas-container { width: 100%; margin-top: 12px; text-align: center; border-radius: 8px; overflow: hidden; border: 1px solid #22273a; background: #000; }
        canvas { width: 100%; height: auto; display: block; }
        
        .action-btn { width: 100%; padding: 12px; margin-top: 12px; background: #ffaa00; border: none; color: #000; font-weight: 800; border-radius: 6px; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #121420; padding: 18px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; border: 1px solid #282d45; }
        .pay-option { display: flex; gap: 10px; margin-top: 12px; }
        .pay-btn-ep { background: #00c853; flex: 1; padding: 12px; border: none; color: white; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 12px; }
        .pay-btn-jc { background: #ff9100; flex: 1; padding: 12px; border: none; color: black; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 12px; }
        .close-btn { background: #222638; width: 100%; margin-top: 10px; padding: 8px; border: none; color: #a0a6c0; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>FF Studio Pro</h2>
    </div>

    <div class="container">
        <div class="section-title">1. Select Template (20 Cut-out Cards)</div>
        <div class="template-grid" id="tplGrid"></div>

        <div class="section-title">2. Player Details</div>
        <label>Player IGN (Name):</label>
        <input type="text" id="ign" value="HAMID_FF" oninput="drawCard()">

        <label>Player UID:</label>
        <input type="text" id="uid" value="1029384756" oninput="drawCard()">

        <label>Character Photo:</label>
        <label for="charImgInput" class="file-btn">📁 Choose Character Photo</label>
        <input type="file" id="charImgInput" accept="image/*" onchange="loadImg(event, 'char')">

        <label>Rank Badge Photo:</label>
        <label for="rankImgInput" class="file-btn file-btn-rank">📁 Choose Rank Badge Photo</label>
        <input type="file" id="rankImgInput" accept="image/*" onchange="loadImg(event, 'rank')">

        <div class="canvas-container">
            <canvas id="cardCanvas" width="600" height="350"></canvas>
        </div>

        <button id="downloadBtn" class="action-btn" onclick="handleDownload()">Download Free Card PNG</button>
    </div>

    <!-- Payment Modal -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <h3 style="color:#ffaa00; font-size: 16px;">PRO TEMPLATE UNLOCK</h3>
            <p id="modalPayText" style="font-size: 11px; margin: 8px 0; color: #8f96b3;">Select App to transfer payment & unlock download.</p>

            <div class="pay-option">
                <button class="pay-btn-ep" onclick="payViaApp('EasyPaisa')">Open EasyPaisa</button>
                <button class="pay-btn-jc" onclick="payViaApp('JazzCash')">Open JazzCash</button>
            </div>
            
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');

        const templatePrices = [
            0, 0, 0, 0, 0,            // T1 - T5 : FREE (Noob)
            60, 80, 100, 120, 150,     // T6 - T10 : PRO Cutouts
            180, 220, 250, 300, 350,   // T11 - T15 : Youtuber Tiers
            400, 450, 500, 600, 750    // T16 - T20 : Ultra Tactical
        ];

        let selectedTemplate = { id: 1, isPaid: false, price: 0 };
        let charImg = null;
        let rankImg = null;

        const EP_NUM = "03160476040";
        const JC_NUM = "03241416116";

        // Build 20 Templates Grid
        const gridContainer = document.getElementById('tplGrid');
        for (let i = 1; i <= 20; i++) {
            const priceVal = templatePrices[i - 1];
            const isPaid = priceVal > 0;
            const priceText = isPaid ? `Rs. ${priceVal}` : 'FREE';
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `tpl-card ${i === 1 ? 'active' : ''}`;
            cardDiv.onclick = () => selectTemplate(i, isPaid, priceVal);
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'tpl-info';
            
            const tplName = document.createElement('span');
            tplName.className = 'tpl-name';
            tplName.innerText = (i <= 5) ? `Noob Card ${i}` : `Pro FF Card ${i}`;

            const tplPrice = document.createElement('span');
            tplPrice.className = `tpl-price ${isPaid ? 'price-paid' : 'price-free'}`;
            tplPrice.innerText = priceText;

            infoDiv.appendChild(tplName);
            infoDiv.appendChild(tplPrice);

            cardDiv.appendChild(infoDiv);
            gridContainer.appendChild(cardDiv);
        }

        function selectTemplate(id, isPaid, price) {
            selectedTemplate = { id, isPaid, price };
            
            const cards = document.querySelectorAll('.tpl-card');
            cards.forEach((card, idx) => {
                if (idx === id - 1) card.classList.add('active');
                else card.classList.remove('active');
            });

            const btn = document.getElementById('downloadBtn');
            if (isPaid) {
                btn.innerText = `Unlock & Download PRO Card (Rs. ${price})`;
                btn.style.background = 'linear-gradient(45deg, #ff0055, #ffaa00)';
                btn.style.color = '#fff';
            } else {
                btn.innerText = 'Download Free Card PNG';
                btn.style.background = '#ffaa00';
                btn.style.color = '#000';
            }

            drawCard();
        }

        // Safe Image Loader
        function loadImg(event, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        if (type === 'char') charImg = img;
                        if (type === 'rank') rankImg = img;
                        drawCard();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Tactical Cut-out Shapes Canvas Drawer
        function drawCardShapeAndBorder(id) {
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.save();
            ctx.beginPath();

            if (id <= 5) {
                // Free / Noob: Box Shape
                ctx.rect(10, 10, w - 20, h - 20);
                ctx.fillStyle = '#0c0e17';
                ctx.fill();
                ctx.strokeStyle = '#3a3f58';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Pro: Cut-out Shapes
                let cut = 15 + (id * 2);
                
                ctx.moveTo(10 + cut, 10);
                ctx.lineTo(w - (10 + cut), 10);
                ctx.lineTo(w - 10, 10 + cut);
                ctx.lineTo(w - 10, h - (10 + cut));
                ctx.lineTo(w - (10 + cut), h - 10);
                ctx.lineTo(w/2 + 40, h - 10);
                ctx.lineTo(w/2, h - 25);
                ctx.lineTo(w/2 - 40, h - 10);
                ctx.lineTo(10 + cut, h - 10);
                ctx.lineTo(10, h - (10 + cut));
                ctx.lineTo(10, 10 + cut);
                ctx.closePath();

                ctx.fillStyle = '#070912';
                ctx.fill();

                ctx.strokeStyle = (id > 15) ? '#ff0055' : ((id > 10) ? '#ffaa00' : '#00e5ff');
                ctx.lineWidth = 5;
                ctx.stroke();

                ctx.fillStyle = ctx.strokeStyle;
                ctx.fillRect(w - (15 + cut), 6, 25, 6);
                ctx.fillRect(15 + cut - 25, h - 12, 25, 6);
            }

            ctx.restore();
        }

        function drawCard() {
            // Background Canvas Fill
            ctx.fillStyle = "#07080c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Outer Frame
            drawCardShapeAndBorder(selectedTemplate.id);

            // 2. High-Level Art / Details
            ctx.save();
            ctx.font = '900 13px Arial';
            ctx.textAlign = 'right';

            if (selectedTemplate.id <= 5) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fillText("BASIC NOOB SURVIVOR", canvas.width - 25, 35);
            } else {
                ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                ctx.fillText("★ PRO YOUTUBER EDITION ★", canvas.width - 25, 35);
                
                ctx.fillStyle = '#ff0033';
                ctx.font = '900 20px Arial';
                ctx.fillText("☠ 999 RED HEADSHOT", canvas.width - 25, 65);
            }
            ctx.restore();

            // 3. Character Upload Slot
            ctx.fillStyle = '#05070c';
            ctx.fillRect(30, 30, 200, 290);
            ctx.strokeStyle = '#282d45';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, 200, 290);

            if (charImg) {
                ctx.drawImage(charImg, 30, 30, 200, 290);
            } else {
                ctx.fillStyle = '#8f96b3';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('CHARACTER PHOTO', 130, 170);
                ctx.fillText('(Upload Image)', 130, 190);
            }

            // 4. Player Details
            const ign = document.getElementById('ign').value || 'SURVIVOR';
            const uid = document.getElementById('uid').value || '0000000000';

            ctx.textAlign = 'left';
            
            // Name
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 24px Arial';
            ctx.fillText(ign.toUpperCase(), 255, 110);

            // UID
            ctx.fillStyle = '#ffaa00';
            ctx.font = 'bold 15px Arial';
            ctx.fillText('UID: ' + uid, 255, 145);

            // Rank Badge
            ctx.fillStyle = '#8f96b3';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('RANK BADGE:', 255, 200);

            if (rankImg) {
                ctx.drawImage(rankImg, 255, 215, 75, 75);
            } else {
                ctx.fillStyle = '#121522';
                ctx.fillRect(255, 215, 75, 75);
                ctx.strokeStyle = '#282d45';
                ctx.strokeRect(255, 215, 75, 75);
                ctx.fillStyle = '#555';
                ctx.font = '10px Arial';
                ctx.fillText('NO BADGE', 268, 258);
            }
        }

        // Render Immediately
        drawCard();

        function handleDownload() {
            if (selectedTemplate.isPaid) {
                document.getElementById('modalPayText').innerText = `Select App to transfer Rs. ${selectedTemplate.price} & unlock download.`;
                document.getElementById('payModal').style.display = 'flex';
            } else {
                finalDownload();
            }
        }

        function payViaApp(method) {
            closeModal();
            let num = (method === 'EasyPaisa') ? EP_NUM : JC_NUM;
            let deepLink = (method === 'EasyPaisa') 
                ? `easypaisa://pay?account=${num}&amount=${selectedTemplate.price}` 
                : `jazzcash://transfer?account=${num}&amount=${selectedTemplate.price}`;

            window.location.href = deepLink;

            setTimeout(() => {
                finalDownload();
            }, 1500);
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        function finalDownload() {
            const link = document.createElement('a');
            link.download = 'FF_Card_' + selectedTemplate.id + '.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
